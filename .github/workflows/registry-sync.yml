# Keeps this fork in sync with zed-industries/extensions and republishes
# whatever changed to Forge's own registry (see
# E:\zed_Source\crates\extension_host for the client that reads it, and
# H:\Persornal\Mentenaz_forge\@mentenaz\Forge_LandingPage\src\app\api\registry
# for the API this posts to).
#
# Two jobs:
#   sync-fork         merges upstream/main in (a plain merge keeps
#                     extensions.toml and its submodule pins in lockstep,
#                     since upstream commits them together), then diffs
#                     the (possibly just-merged) extensions.toml against
#                     the live registry. This diff — not "did the merge
#                     produce new commits" — is what decides whether
#                     build-and-publish runs: a commit pushed directly to
#                     this fork (e.g. adding your own extension) changes
#                     nothing about the upstream merge, but still needs a
#                     build. Needs only Python + curl, not Rust, so this
#                     stays cheap even when nothing changed.
#   build-and-publish only runs when that diff found something. Fetches
#                     only the submodules for the extensions that actually
#                     changed (this repo has 1000+ submodules — checking
#                     all of them out on every run would be needlessly
#                     slow), builds each with extension_cli, uploads the
#                     packaged archives to one GitHub Release for this
#                     run, and POSTs the results to the sync relay route.
#
# Secrets to set on this fork (Settings -> Secrets and variables -> Actions):
#   FORGE_REGISTRY_SYNC_SECRET   shared secret; must match the same-named
#                                 env var on the Forge_LandingPage Vercel
#                                 project.
#   ZED_SOURCE_TOKEN              only needed if mentenaz/mentenaz.Forge.Super is
#                                 private — a PAT with read access to it,
#                                 used to check it out to build extension_cli.
#                                 Omit if that repo is public; the checkout
#                                 step below falls back to the default
#                                 GITHUB_TOKEN, which can't read another
#                                 private repo.
#
# Also requires: Settings -> Actions -> General -> Workflow permissions
# set to "Read and write permissions", so sync-fork can push the merge and
# build-and-publish can create a Release.

name: registry-sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

env:
  REGISTRY_API_URL: https://forge.mentenaz-server.com/api/registry

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      pending_total: ${{ steps.diff.outputs.pending_total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Configure git identity
        run: |
          git config user.name "forge-registry-sync[bot]"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge upstream/main
        run: |
          git remote add upstream https://github.com/zed-industries/extensions.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          git merge upstream/main --no-edit
          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compares extensions.toml (post-merge) against the live registry's
      # versions. Anything new, removed-then-readded, or version-bumped —
      # whether that came from the upstream merge above or a direct commit
      # to this fork — gets uploaded as an artifact for build-and-publish
      # to act on. No Rust needed here, so an empty diff stays fast.
      - name: Diff extensions.toml against the live registry
        id: diff
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tomllib
          import urllib.error
          import urllib.request

          # How many candidates the build job gets to try, not how many it
          # builds (it stops at its own MAX_BUILD successes). More than that
          # on purpose: an extension that cannot be built, such as one whose
          # pinned grammar commit no longer exists upstream, is skipped, and
          # if only the first MAX_BUILD were ever offered, the same broken
          # ones at the front of the alphabet would be picked every run and
          # hold up everything behind them. Capped so a long gap since the
          # last sync still catches up over several runs, and so the list
          # stays small enough to pass between jobs.
          MAX_ATTEMPTS = 60

          with open("extensions.toml", "rb") as f:
              toml_data = tomllib.load(f)

          live = {}
          try:
              with urllib.request.urlopen(f"{os.environ['REGISTRY_API_URL']}/extensions") as resp:
                  rows = json.load(resp)["data"]
              # The listing once stopped silently at 1000 rows, so the oldest
              # published extensions looked missing and were rebuilt on every
              # run while nothing new got built. It now returns every row, so
              # exactly 1000 means the cap is back: stop rather than diff
              # against a cut-short list.
              if len(rows) == 1000:
                  raise SystemExit(
                      "the live registry listing returned exactly 1000 rows; it is "
                      "probably truncated, and diffing against it would rebuild "
                      "extensions that are already published"
                  )
              for row in rows:
                  live[row["id"]] = row["version"]
          except urllib.error.URLError as e:
              print(f"warning: could not fetch live registry, treating everything as new: {e}")

          all_changed = sorted(
              (
                  {"id": ext_id, **entry}
                  for ext_id, entry in toml_data.items()
                  if live.get(ext_id) != entry.get("version")
              ),
              key=lambda e: e["id"],
          )
          changed = all_changed[:MAX_ATTEMPTS]
          print(
              f"{len(all_changed)} of {len(toml_data)} extensions changed; "
              f"offering {len(changed)} to the build job this run"
          )

          pathlib.Path("/tmp/changed.json").write_text(json.dumps(changed))

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
              f.write(f"pending_total={len(all_changed)}\n")
          PY

      - name: Upload the changed-extensions list
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changed-extensions
          path: /tmp/changed.json
          retention-days: 1

  build-and-publish:
    needs: sync-fork
    if: needs.sync-fork.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      # Run 41382309370 died with "No space left on device" 6 minutes into
      # the build step: the zed_Source target/ directory, a wasi-sdk copy
      # per extension and each Rust extension's own target/ add up to more
      # than a stock runner's ~14GB of free space. Same step the Linux
      # installer job already uses.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout this fork (post-merge, submodules fetched below)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: false
          fetch-depth: 1

      - name: Download the changed-extensions list
        uses: actions/download-artifact@v4
        with:
          name: changed-extensions
          path: /tmp

      - name: Checkout Forge Super (for extension_cli)
        uses: actions/checkout@v4
        with:
          repository: mentenaz/mentenaz.Forge.Super
          path: zed_Source
          token: ${{ secrets.ZED_SOURCE_TOKEN || secrets.GITHUB_TOKEN }}

      # extension_cli has its own rust-toolchain.toml in zed_Source; cargo
      # picks that pinned version up automatically via rustup, no need to
      # hardcode a version here.
      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "zed_Source -> target"

      # No debuginfo: extension_cli never needs it, and the workspace's
      # release profile keeps it, which makes target/ (and the cache saved
      # from it) several times larger.
      - name: Build extension_cli
        working-directory: zed_Source
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: cargo build --release -p extension_cli

      - name: Build each changed extension
        id: build
        env:
          # extension_cli reports --lenient validation failures with
          # log::warn!, which env_logger hides unless asked.
          RUST_LOG: warn
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess

          # Try candidates in order until this many have built. A candidate
          # that fails is skipped rather than ending the run, so a few
          # genuinely broken extensions can't stop the rest.
          MAX_BUILD = 20

          changed = json.load(open("/tmp/changed.json"))

          assets_dir = pathlib.Path("/tmp/release-assets")
          assets_dir.mkdir(parents=True, exist_ok=True)
          results = []
          failures = []

          # One scratch directory for every extension, not one each: it is
          # where extension_cli downloads wasi-sdk (hundreds of MB), which
          # it reuses when it is already there. A directory per extension
          # downloaded it again for every extension that has a grammar.
          scratch_dir = pathlib.Path("/tmp/scratch")

          def fail(ext_id, reason):
              print(f"FAILED {ext_id}: {reason}")
              failures.append({"id": ext_id, "reason": reason})

          # The registry shows each extension's README on its page. It is read
          # here, from the folder the extension was built from, because that
          # is the exact commit that was built (and the right sub-folder for
          # an extension that lives inside a larger repository).
          README_LIMIT = 100_000  # characters; the page only needs the start of a long one

          def read_readme(source_dir):
              """The text of the extension's README, or "" when it has none."""
              found = sorted(
                  (p for p in source_dir.iterdir() if p.is_file() and p.name.lower().startswith("readme")),
                  key=lambda p: (p.suffix.lower() not in (".md", ".markdown"), p.name),
              )
              if not found:
                  return ""
              text = found[0].read_bytes().decode("utf-8", errors="replace")
              return text.replace("\x00", "")[:README_LIMIT]

          def readme_bases(submodule, sub_path):
              """Where a README's relative links and images point, at the built
              commit: (raw files, file pages). Only for GitHub, the one host
              whose addresses the site can show images from."""
              def git(*args):
                  return subprocess.run(
                      ["git", "-C", str(submodule), *args], capture_output=True, text=True, check=True
                  ).stdout.strip()

              match = re.match(r"https://github\.com/([^/]+)/([^/]+?)(?:\.git)?/?$", git("remote", "get-url", "origin"))
              if not match:
                  return None, None
              owner, repo = match.groups()
              commit = git("rev-parse", "HEAD")
              folder = f"{sub_path.strip('/')}/" if sub_path else ""
              return (
                  f"https://raw.githubusercontent.com/{owner}/{repo}/{commit}/{folder}",
                  f"https://github.com/{owner}/{repo}/blob/{commit}/{folder}",
              )

          for entry in changed:
              if len(results) >= MAX_BUILD:
                  break

              ext_id = entry["id"]
              submodule = pathlib.Path(entry["submodule"])
              sub_path = entry.get("path")
              source_dir = submodule / sub_path if sub_path else submodule
              out_dir = pathlib.Path("/tmp/out") / ext_id

              try:
                  # This repo has 1000+ submodules, so each one is fetched
                  # when it is needed rather than all of them up front.
                  fetched = subprocess.run(
                      ["git", "submodule", "update", "--init", "--depth", "1", "--", str(submodule)],
                      capture_output=True, text=True,
                  )
                  if fetched.returncode != 0 or not source_dir.is_dir():
                      last = (fetched.stderr.strip().splitlines() or ["not checked out"])[-1]
                      fail(ext_id, f"could not fetch the submodule: {last}")
                      continue

                  # A Rust extension may pin its own toolchain
                  # (rust-toolchain.toml), and extension_cli only adds the
                  # wasm target to the default one, so the pinned toolchain
                  # is missing it and the build dies with "can't find crate
                  # for `core`". rustup honours the directory's override.
                  if (source_dir / "Cargo.toml").exists():
                      subprocess.run(
                          ["rustup", "target", "add", "wasm32-wasip2"],
                          cwd=source_dir, capture_output=True, text=True,
                      )

                  def build(env=None):
                      return subprocess.run(
                          [
                              os.path.abspath("zed_Source/target/release/zed-extension"),
                              "--lenient",
                              "--source-dir", str(source_dir),
                              "--output-dir", str(out_dir),
                              "--scratch-dir", str(scratch_dir),
                          ],
                          capture_output=True, text=True, env=env,
                      )

                  built = build()

                  # An extension that pins an old Rust toolchain (typos pins
                  # 1.80) can fail on dependencies that need a newer cargo,
                  # which says nothing about the extension itself. Try once
                  # more with the current stable toolchain; RUSTUP_TOOLCHAIN
                  # outranks the pin. An extension that still fails is
                  # reported with the second error.
                  pins_toolchain = any((source_dir / n).exists() for n in ("rust-toolchain.toml", "rust-toolchain"))
                  if built.returncode != 0 and pins_toolchain:
                      print(f"{ext_id}: failed with its pinned toolchain; retrying with current stable Rust")
                      subprocess.run(
                          ["rustup", "toolchain", "install", "stable", "--profile", "minimal", "--target", "wasm32-wasip2"],
                          capture_output=True, text=True,
                      )
                      built = build({**os.environ, "RUSTUP_TOOLCHAIN": "stable"})
                  output = (built.stdout + built.stderr).strip()
                  warnings = [l for l in output.splitlines() if "ignoring validation failure" in l]
                  for w in warnings:
                      print(f"{ext_id}: {w[:300]}")

                  if built.returncode != 0:
                      errors = [l.strip() for l in output.splitlines() if l.strip().startswith("Error:")]
                      reason = errors[-1] if errors else (output.splitlines() or ["no output"])[-1].strip()
                      print(output[-1500:])
                      fail(ext_id, reason[:300])
                      continue

                  manifest = json.loads((out_dir / "manifest.json").read_text())
                  asset_name = f"{ext_id}-{manifest['version']}.tar.gz"
                  (out_dir / "archive.tar.gz").rename(assets_dir / asset_name)

                  # A README that cannot be read must not fail the build: the
                  # keys are left out and the backfill picks it up later.
                  readme_fields = {}
                  try:
                      raw_base, blob_base = readme_bases(submodule, sub_path)
                      readme_fields = {
                          "readme": read_readme(source_dir),
                          "readme_raw_base": raw_base,
                          "readme_blob_base": blob_base,
                      }
                  except Exception as error:
                      print(f"{ext_id}: could not read the README: {error}")

                  results.append({"id": ext_id, "asset_name": asset_name, **manifest, **readme_fields})
                  print(f"built {ext_id} {manifest['version']}")
              finally:
                  # A Rust extension compiles into its own target/ inside
                  # the submodule checkout, which can be a GB or more and
                  # is of no use once the archive exists.
                  shutil.rmtree(source_dir / "target", ignore_errors=True)
                  shutil.rmtree(out_dir, ignore_errors=True)
                  free_gb = shutil.disk_usage("/").free / 2**30
                  print(f"{ext_id}: {free_gb:.1f} GB free")

          pathlib.Path("/tmp/results.json").write_text(json.dumps(results))
          print(f"{len(results)} built, {len(failures)} failed")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Registry sync: {len(results)} built, {len(failures)} failed\n\n")
              if failures:
                  f.write("| Extension | Why it failed |\n|---|---|\n")
                  for x in failures:
                      reason = x["reason"].replace("|", "\\|")
                      f.write(f"| `{x['id']}` | {reason} |\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"built={'true' if results else 'false'}\n")
              f.write(f"built_count={len(results)}\n")
          PY

      - name: Create release with the built archives
        id: release
        # hashFiles() only searches within $GITHUB_WORKSPACE, not arbitrary
        # absolute paths like /tmp/release-assets — it would always report
        # no match here regardless of what's actually in /tmp, so this
        # gates on the previous step's own output instead.
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="registry-sync-${{ github.run_number }}"
          gh release create "$tag" /tmp/release-assets/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "Registry sync #${{ github.run_number }}" \
            --notes "Automated sync from zed-industries/extensions."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Notify the registry sync endpoint
        if: steps.release.outputs.tag != ''
        env:
          SYNC_SECRET: ${{ secrets.FORGE_REGISTRY_SYNC_SECRET }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          results = json.loads(pathlib.Path("/tmp/results.json").read_text())
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPO"]

          payload = {
              "extensions": [
                  {
                      "id": r["id"],
                      "version": r["version"],
                      "name": r["name"],
                      "description": r.get("description"),
                      "authors": r["authors"],
                      "repository": r["repository"],
                      "schema_version": r.get("schema_version"),
                      "wasm_api_version": r.get("wasm_api_version"),
                      "provides": r["provides"],
                      "artifact_url": f"https://github.com/{repo}/releases/download/{tag}/{r['asset_name']}",
                      # Only sent when it was read, so the site keeps an earlier
                      # README rather than losing it to a build that could not.
                      **{k: r[k] for k in ("readme", "readme_raw_base", "readme_blob_base") if k in r},
                  }
                  for r in results
              ]
          }

          req = urllib.request.Request(
              f"{os.environ['REGISTRY_API_URL']}/sync",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {os.environ['SYNC_SECRET']}",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          PY

      # Clears a backlog (e.g. the initial empty-registry backfill) over
      # several back-to-back runs instead of waiting six hours between
      # each MAX_PER_RUN-sized batch. Based on sync-fork's diff, not on
      # whether this run's build/release actually succeeded, so the chain
      # keeps going even if some extensions in this batch failed to build
      # — the next run's diff decides what's still pending from scratch.
      # Naturally stops once nothing's left; the schedule trigger then
      # covers ongoing incremental syncs as usual.
      - name: Trigger the next run if more of the backlog remains
        # Only while runs make progress: a run that built nothing would
        # otherwise retrigger itself on the same head of the queue forever.
        if: steps.build.outputs.built == 'true' && fromJSON(needs.sync-fork.outputs.pending_total) > fromJSON(steps.build.outputs.built_count)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run registry-sync.yml --repo "${{ github.repository }}"
